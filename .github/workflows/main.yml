name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/CRUD-DB-API/go.mod

      - name: Run CRUD-DB-API unit tests
        working-directory: backend/CRUD-DB-API
        run: go test ./...

      - name: Run PublicVoteConverter unit tests
        working-directory: backend/PublicVoteConverter
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install EuroStats dependencies
        working-directory: backend/EuroStats
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Generate EuroStats proto files
        working-directory: backend/EuroStats
        run: |
          mkdir -p src/proto
          touch src/proto/__init__.py
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=src/proto \
            --grpc_python_out=src/proto \
            proto/votes.proto
          sed -i \
            's/^import votes_pb2 as votes__pb2$/from . import votes_pb2 as votes__pb2/' \
            src/proto/votes_pb2_grpc.py

      - name: Run EuroStats unit tests
        working-directory: backend/EuroStats
        run: python -m pytest

  test:
    name: Check all containers start
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          EOF

      - name: Build images
        run: docker compose build --parallel

      - name: Start services
        run: docker compose up -d --wait

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
