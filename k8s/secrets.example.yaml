apiVersion: v1
kind: Secret
metadata:
  name: esc-secrets-example
  namespace: esc-voting
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "<set-strong-mysql-root-password>"
  MYSQL_PASSWORD: "<set-strong-mysql-app-password>"
  RESEND_API_KEY: "<set-resend-api-key>"
  COOKIESIGNINGKEY: "<set-cookie-signing-key>"
  PHONESIGNINGKEY: "<set-phone-signing-key>"
  adminMail: "<set-admin-email>"
  adminPassword: "<set-admin-password-bcrypt-hash>"
  juryMail1: "<set-jury1-email>"
  juryPassword1: "<set-jury1-password-bcrypt-hash>"
  juryMail2: "<set-jury2-email>"
  juryPassword2: "<set-jury2-password-bcrypt-hash>"
  juryMail3: "<set-jury3-email>"
  juryPassword3: "<set-jury3-password-bcrypt-hash>"
