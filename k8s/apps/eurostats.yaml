apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurostats
  namespace: esc-voting
  labels:
    app: eurostats
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eurostats
  template:
    metadata:
      labels:
        app: eurostats
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eurostats
          image: ghcr.io/git47829/esc-voting-eurostats:sha-8a85722bb93171dae850617cd12174e7bb4f09ca
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8880
              name: http
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eurostats
  namespace: esc-voting
spec:
  selector:
    app: eurostats
  ports:
    - name: http
      port: 8880
      targetPort: 8880
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eurostats
  namespace: esc-voting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eurostats
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
