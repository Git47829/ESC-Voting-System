apiVersion: apps/v1
kind: Deployment
metadata:
  name: esc-frontend
  namespace: esc-voting
  labels:
    app: esc-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: esc-frontend
  template:
    metadata:
      labels:
        app: esc-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: esc-frontend
          image: ghcr.io/git47829/esc-voting-esc-frontend:sha-8a85722bb93171dae850617cd12174e7bb4f09ca
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: esc-frontend
  namespace: esc-voting
spec:
  selector:
    app: esc-frontend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: esc-frontend
  namespace: esc-voting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: esc-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
