apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: esc-voting
data:
  tempo.yml: |
    target: all

    server:
      http_listen_port: 3200
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4417"
            http:
              endpoint: "0.0.0.0:4418"

    ingester:
      max_block_duration: 5m
      lifecycler:
        ring:
          replication_factor: 1
          kvstore:
            store: inmemory

    metrics_generator:
      registry:
        external_labels:
          source: tempo
        max_label_name_length: 1024
        max_label_value_length: 2048
        collection_interval: 15s
      processor:
        span_metrics:
          dimensions: []
        service_graphs:
          max_items: 1000
      storage:
        path: /tmp/tempo/generator/wal
        remote_write:
          - url: http://prometheus:9090/api/v1/write
            send_exemplars: true
        wal:
          truncate_frequency: 2m

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal

    overrides:
      defaults:
        metrics_generator:
          processors: [span-metrics, service-graphs]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: esc-voting
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.4.2
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4417
              name: otlp-grpc
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: tempo-data
              mountPath: /tmp/tempo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: tempo-config
  volumeClaimTemplates:
    - metadata:
        name: tempo-data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: esc-voting
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4417
      targetPort: 4417
