{% extends "base.html" %}

{% block title %}{{ code }} — ESC Voting System{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-8rem)] items-center justify-center px-4">

    <div class="w-full max-w-lg text-center">

        <!-- Error Code -->
        <h1 class="font-heading text-8xl sm:text-9xl font-extrabold text-esc-yellow tracking-tighter mb-6 leading-none select-none">
            {{ code }}
        </h1>

        <!-- http.cat Image -->
        <div class="mx-auto mb-8 max-w-md overflow-hidden rounded-2xl border border-esc-surface shadow-xl shadow-black/30">
            <img
                src="https://http.cat/{{ code }}"
                alt="HTTP {{ code }} Cat"
                class="w-full h-auto object-cover"
                loading="eager"
                onerror="this.onerror=null; this.src='https://http.cat/404'; this.alt='Error Cat';"
            >
        </div>

        <!-- Error Message -->
        <p class="text-sm text-esc-muted max-w-sm mx-auto mb-8 leading-relaxed">
            {{ message | default("Something unexpected happened.") }}
        </p>

        <!-- Actions -->
        <div class="flex items-center justify-center gap-4">
            <a
                href="/"
                class="inline-flex items-center gap-2 rounded-lg bg-esc-yellow px-5 py-3 text-sm font-heading font-bold text-esc-black uppercase tracking-wider
                       hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-esc-yellow focus:ring-offset-2 focus:ring-offset-esc-black
                       transition-colors active:scale-[0.98]"
            >
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back to Home
            </a>

            <button
                type="button"
                onclick="history.back()"
                class="inline-flex items-center gap-2 rounded-lg border border-esc-surface bg-esc-surface/50 px-5 py-3 text-sm font-heading font-semibold text-esc-text
                       hover:border-esc-muted/50 hover:text-esc-yellow focus:outline-none focus:ring-2 focus:ring-esc-yellow/40 focus:ring-offset-2 focus:ring-offset-esc-black
                       transition-colors"
            >
                Go Back
            </button>
        </div>

    </div>

</div>
{% endblock %}
