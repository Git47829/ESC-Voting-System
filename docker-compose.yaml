version: "3.3"

services:
  db:
    build: ./backend/DB/
    container_name: escmysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: esc_voting
      MYSQL_USER: esc_user
      MYSQL_PASSWORD: esc_password
      MYSQL_ROOT_PASSWORD: secretroot
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      backend:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: ./backend/CRUD-DB-API/
    container_name: db-crud-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: esc_voting
      DB_USER: esc_user
      DB_PASS: esc_password
      OTEL_EXPORTER_OTLP_HTTP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - backend
      - frontend
      - observability

  frontend:
    build: ./frontend/
    container_name: esc-frontend
    restart: unless-stopped
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-esc-voting-secret-change-me}
      API_BASE_URL: http://db-crud-api:8000
      API_TIMEOUT: 10
      FLASK_PORT: 5000
      OTEL_SERVICE_NAME: esc-voting-frontend
      OTEL_SERVICE_VERSION: "1.0.0"
      OTEL_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_HTTP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: http://otel-collector:4317
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - frontend
      - observability
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  eurostats:
    build:
      context: ./backend/EuroStats
      dockerfile: Dockerfile
    container_name: eurostats
    environment:
      - GRPC_HOST=db-crud-api
      - GRPC_PORT=50051
      - LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - backend
      - observability
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8880/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.94.0
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./backend/Observability/OTel/src/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    networks:
      - observability
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--web.external-url=https://localhost/prometheus"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ./backend/Observability/Prometheus/src/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - observability
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SERVER_ROOT_URL: https://localhost/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/Observability/grafana/src/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    depends_on:
      - prometheus
      - tempo

  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability
    volumes:
      - loki_data:/loki

  tempo-init:
    image: busybox
    user: root
    command: chown -R 10001:10001 /tmp/tempo
    volumes:
      - tempo_data:/tmp/tempo

  tempo:
    image: grafana/tempo:2.4.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./backend/Observability/Tempo/src/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    networks:
      - observability
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./backend/Caddy/src/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - observability
    depends_on:
      - frontend
      - api
      - eurostats
      - grafana
      - prometheus
      - tempo
      - loki
      - otel-collector

volumes:
  mysql_data:
  grafana_data:
  loki_data:
  tempo_data:
  caddy_data:
  caddy_config:

networks:
  backend:
  frontend:
  observability:
