version: "3.3"

services:
  db:
    build: ./backend/DB/
    container_name: escmysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: esc_voting
      MYSQL_USER: esc_user
      MYSQL_PASSWORD: esc_password
      MYSQL_ROOT_PASSWORD: secretroot
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      backend:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: ./backend/CRUD-DB-API/
    container_name: db-crud-api
    restart: unless-stopped
    ports:
      - 8000
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: esc_voting
      DB_USER: esc_user
      DB_PASS: esc_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - db
    networks:
      - backend
      - frontend
      - observability

  frontend:
    build: ./frontend/
    container_name: esc-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-esc-voting-secret-change-me}
      API_BASE_URL: http://db-crud-api:8000
      API_TIMEOUT: 10
      FLASK_PORT: 5000
      # OpenTelemetry
      OTEL_SERVICE_NAME: esc-voting-frontend
      OTEL_SERVICE_VERSION: "1.0.0"
      OTEL_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_HTTP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: http://otel-collector:4317
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - frontend
      - observability
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  eurostats:
    build:
      context: ./backend/EuroStats
      dockerfile: Dockerfile
    container_name: eurostats
    ports:
      - "8881:8880"
    environment:
      - GRPC_HOST=db-crud-api
      - GRPC_PORT=50051
      - LOG_LEVEL=INFO
    depends_on:
      - api
    networks:
      - backend
      - observability
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8880/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.94.0
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./backend/Observability/OTel/src/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9464:9464" # Prometheus scrape endpoint
    networks:
      - observability
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./backend/Observability/Prometheus/src/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - observability
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.2
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/Observability/grafana/src/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - observability
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - observability
    volumes:
      - loki_data:/loki

volumes:
  mysql_data:
  grafana_data:
  loki_data:

networks:
  backend:
  frontend:
  observability:
