version: "3.3"

services:
  api:
    build: /backend/CRUD-DB-API/
    container_name: db-crud-api
    restart: unless-stopped
    ports:
      - 8000
    env_file:
      - .env
    enviroment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: esc_voting
      DB_USER: esc_user
      DB_PASS: esc_password
    depends_on:
      - db
    networks:
      - backend
      - frontend

  db:
    build: /backend/DB/
    container_name: escmysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: esc_voting
      MYSQL_USER: esc_user
      MYSQL_PASSWORD: esc_password
      MYSQL_ROOT_PASSWORD: secretroot
    volumes:
      - mysql_data:/var/lib/mysql/data
    networks:
      - backend
      -

    otel-collector:
      image: otel/opentelemetry-collector-contrib:0.94.0
      command: ["--config=/etc/otel/otel-collector.yml"]
      volumes:
        - ./backend/Observability/OTel/src/otel-collector.yml:/etc/otel/otel-collector.yml:ro
      ports:
        - "4317:4317" # OTLP gRPC
        - "4318:4318" # OTLP HTTP
        - "9464:9464" # Prometheus scrape endpoint
      networks:
        - observability

    prometheus:
      image: prom/prometheus:v2.51.1
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
      volumes:
        - ./backend/Observability/Prometheus/src/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      ports:
        - "9090:9090"
      networks:
        - observability
      depends_on:
        - otel-collector

    grafana:
      image: grafana/grafana:10.4.2
      volumes:
        - grafana_data:/var/lib/grafana
        - ./backend/Observability/grafana/src/provisioning:/etc/grafana/provisioning:ro
      ports:
        - "3000:3000"
      networks:
        - observability
      depends_on:
        - prometheus

volumes:
  mysql_data:
  grafana_data:

networks:
  backend:
  frontend:
  observability:
