apiVersion: 1

providers:
  - name: "ESC Voting Dashboards"
    orgId: 1
    folder: "ESC Voting System"
    folderUid: "esc-voting"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
