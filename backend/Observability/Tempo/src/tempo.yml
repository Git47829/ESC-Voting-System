target: all
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

usage_report:
  reporting_enabled: false

distributor:
  ingester_write_path_enabled: true # Explizit alten Pfad aktivieren
  kafka_write_path_enabled: false # Kafka deaktivieren
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4417"
        http:
          endpoint: "0.0.0.0:4418"

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: memberlist

memberlist:
  abort_if_cluster_join_fails: false
  bind_port: 7946
  join_members:
    - tempo:7946

query_frontend:
  rf1_after: "1999-01-01T00:00:00Z"

querier:
  frontend_worker:
    frontend_address: "localhost:9095"

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
