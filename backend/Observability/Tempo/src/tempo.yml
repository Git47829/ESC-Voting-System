target: all

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4417"
        http:
          endpoint: "0.0.0.0:4418"

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: inmemory

metrics_generator:
  ring:
    kvstore:
      store: inmemory
  processor:
    local_blocks:
      max_live_traces: 50000
      max_block_duration: 5m
      max_block_bytes: 314572800 # 300 MiB
      flush_check_period: 5s
      trace_idle_period: 10s
      complete_block_timeout: 15m
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks
      generate_native_histograms: both
