target: all

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4418
        grpc:
          endpoint: 0.0.0.0:4417

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: inmemory

querier:
  search:
    prefer_self: 10

query_frontend:
  search:
    prefer_self: 10

ingester_client:
  grpc_client_config:
    grpc_compression: gzip

memberlist:
  bind_addr: ["0.0.0.0"]
  join_members: []

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
