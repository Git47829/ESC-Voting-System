target: all

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4417"
        http:
          endpoint: "0.0.0.0:4418"

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: inmemory

metrics_generator:
  registry:
    external_labels:
      source: tempo
    # Limit the number of active series to cap memory usage
    max_label_name_length: 1024
    max_label_value_length: 2048
    collection_interval: 15s
  processor:
    span_metrics:
      dimensions: []
    service_graphs:
      max_items: 1000
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
    wal:
      truncate_frequency: 2m

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
