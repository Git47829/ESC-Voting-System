receivers:
  otlp:
    protocols:
      grpc:
      http:

  # Tail Traefik's newline-delimited JSON access log from the shared Docker
  # volume. Each line is a self-contained JSON object emitted by Traefik's
  # built-in log directive (format json).
  filelog:
    include:
      - /var/log/traefik/access.log
    # Pick up lines written before the collector started (e.g. after a
    # collector restart) so no entries are silently lost.
    start_at: beginning
    operators:
      # ── 1. Parse the JSON line into structured log attributes ──────────────
      - type: json_parser
        timestamp:
          parse_from: attributes.ts
          layout_type: epoch
          layout: s

      # ── 2. Derive OTel severity from the HTTP status code ──────────────────
      #   100–399 → INFO
      #   400–499 → WARN
      #   500–599 → ERROR
      - type: severity_parser
        parse_from: attributes.status
        mapping:
          info:
            min: 100
            max: 399
          warn:
            min: 400
            max: 499
          error:
            min: 500
            max: 599
        on_error: send

      # ── 3. Write a plain-string "level" attribute ──────────────────────────
      # The attributes/loki_labels processor promotes attributes.level to a
      # Loki stream label so log lines are queryable by severity in Grafana.
      # We default to INFO here; 4xx/5xx lines already carry the right OTel
      # SeverityNumber from step 2 and will be filterable via Loki's
      # structured-metadata support.
      - type: add
        field: attributes.level
        value: INFO

      # ── 4. Tag the resource with service.name = traefik ───────────────────
      # The resource/loki_labels processor (see processors section) promotes
      # resource attributes listed in loki.resource.labels to Loki stream
      # labels. service.name is already in that list, so every Traefik log
      # line will appear under {service_name="traefik"} in Loki — exactly like
      # the other services in the stack.
      - type: add
        field: resource["service.name"]
        value: traefik

processors:
  batch:

  # Promote resource attributes to Loki stream labels.
  # loki.resource.labels tells the Loki exporter which resource-level
  # attributes to index as labels rather than embedding in the log body.
  resource/loki_labels:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name

  # Promote log-level attributes to Loki stream labels.
  # traceID and spanID become labels so that Grafana's tracesToLogsV2
  # filterByTraceID link can issue an exact-match label query instead of
  # a slow full-scan over the log body.
  attributes/loki_labels:
    actions:
      - action: insert
        key: loki.attribute.labels
        value: traceID, spanID, level

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
    namespace: "esc"
    send_timestamps: true
    metric_expiration: 180m
    resource_to_telemetry_conversion:
      enabled: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true
      instance: false
      level: true

  otlp:
    endpoint: tempo:4417
    tls:
      insecure: true

  logging: {}

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, logging]
    logs:
      receivers: [otlp, filelog]
      processors: [batch, resource/loki_labels, attributes/loki_labels]
      exporters: [loki]
