global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "esc-frontend"
    static_configs:
      - targets: ["esc-frontend:5000"]
    metrics_path: /metrics
    scrape_interval: 15s
