[package]
name = "EuroMail"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
dotenvy = "0.15.7"
resend-rs = "0.23.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
